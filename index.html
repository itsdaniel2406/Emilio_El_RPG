<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emolio el RPG v6.0 - Castle & Boss Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    /* Pantalla de rotación */
    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    /* HUD Superior Izquierdo */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #3b82f6;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    /* Panel Superior Derecho (Botones ordenados) */
    #top-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: row;
      gap: 6px;
      z-index: 15;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #64748b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-btn:active { transform: scale(0.95); }
    #save-btn { border-color: #22c55e; color: #4ade80; }
    #load-btn { border-color: #3b82f6; color: #60a5fa; }
    #reload-btn { border-color: #f59e0b; color: #fbbf24; }
    #fs-btn { border-color: #a855f7; color: #c084fc; }

    /* Marca de agua corregida */
    #watermark {
      position: absolute;
      bottom: 75px;
      left: 15px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1.5px;
      pointer-events: none;
      z-index: 10;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* Barra Inferior de Héroes */
    #hero-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 14px;
      border-radius: 14px;
      border: 2px solid #475569;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    .hero-btn:active { transform: scale(0.95); }
    .hero-btn span { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }

    /* Alerta / Barra del Jefe Final */
    #boss-bar-container {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 6px 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 12;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }
    #boss-title { font-size: 12px; font-weight: bold; color: #fca5a5; margin-bottom: 4px; text-transform: uppercase; }
    .boss-hp-bg { width: 100%; height: 10px; background: #450a0a; border-radius: 4px; overflow: hidden; }
    #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }

    /* Modales Roguelike */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 24px; color: #fbbf24; margin-bottom: 20px; }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 150px; height: 210px; background: #1e293b; border: 3px solid #f59e0b;
      border-radius: 10px; padding: 12px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; text-align: center; cursor: pointer;
    }
    .card-item h3 { color: #fbbf24; font-size: 14px; }
    .card-item p { font-size: 11px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; color: #000; }

    /* Toast Notification */
    #toast {
      position: absolute; top: 50px; right: 10px; background: rgba(15, 23, 42, 0.95);
      border: 2px solid #22c55e; color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: bold; display: none; z-index: 25;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emolio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <!-- Panel de Botones superior derecho perfectamente alineados -->
    <div id="top-controls">
      <button class="top-btn" id="save-btn" onclick="saveGame()">💾 Guardar</button>
      <button class="top-btn" id="load-btn" onclick="loadGame()">📂 Cargar</button>
      <button class="top-btn" id="reload-btn" onclick="location.reload(true)">🔄 Recargar</button>
      <button class="top-btn" id="fs-btn" onclick="goFullscreen()">⛶ Pantalla Completa</button>
    </div>

    <!-- Barra de Vida del Jefe -->
    <div id="boss-bar-container">
      <div id="boss-title">⚠️ ¡JEFE FINAL DE OLEADA! ⚠️</div>
      <div class="boss-hp-bg"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="toast"></div>
    <div id="watermark">Creado por Dani v2</div>
    
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

function showToast(msg, color = '#22c55e') {
  const toast = document.getElementById('toast');
  toast.style.borderColor = color;
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  paused: false,
  inWave: true,
  bossSpawned: false
};

const HERO_TYPES = {
  knight: { name: 'Guerrero', hp: 250, maxHp: 250, dmg: 20, range: 50, speed: 1.2, atkSpeed: 45, cost: 30, type: 'knight' },
  archer: { name: 'Arquera', hp: 120, maxHp: 120, dmg: 16, range: 350, speed: 1.0, atkSpeed: 28, cost: 40, type: 'archer' },
  mage:   { name: 'Mago', hp: 100, maxHp: 100, dmg: 40, range: 250, speed: 0.8, atkSpeed: 60, cost: 60, type: 'mage' },
  paladin:{ name: 'Paladín', hp: 500, maxHp: 500, dmg: 12, range: 50, speed: 0.6, atkSpeed: 55, cost: 80, type: 'paladin' }
};

let heroes = [];
let enemies = [];
let projectiles = [];
let particles = [];

function saveGame() {
  const saveData = { game: game, heroTypes: HERO_TYPES };
  localStorage.setItem('emolio_rpg_save', JSON.stringify(saveData));
  showToast('💾 Partida Guardada');
}

function loadGame() {
  const saved = localStorage.getItem('emolio_rpg_save');
  if (!saved) { showToast('⚠️ No hay partida guardada', '#ef4444'); return; }
  
  const parsed = JSON.parse(saved);
  game = parsed.game;
  Object.assign(HERO_TYPES, parsed.heroTypes);

  heroes = []; enemies = []; projectiles = []; particles = [];
  game.inWave = true; game.paused = false; game.bossSpawned = false;
  document.getElementById('card-modal').style.display = 'none';
  document.getElementById('boss-bar-container').style.display = 'none';
  
  startWave();
  showToast('📂 Partida Cargada', '#3b82f6');
}

function startWave() {
  game.bossSpawned = false;
  document.getElementById('boss-bar-container').style.display = 'none';
  let count = 3 + game.wave * 2;

  // Spawnea secuencialmente las tropas normales
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * 65),
      y: 380 + (Math.random() * 180 - 90),
      hp: 60 + game.wave * 22,
      maxHp: 60 + game.wave * 22,
      dmg: 10 + game.wave * 3,
      speed: 0.7 + Math.random() * 0.4,
      range: 35,
      atkSpeed: 45,
      timer: 0,
      isBoss: false,
      anim: Math.random() * 10
    });
  }
}

function spawnBoss() {
  game.bossSpawned = true;
  document.getElementById('boss-bar-container').style.display = 'flex';
  
  let bossHp = 800 + game.wave * 350;
  enemies.push({
    x: 1350,
    y: 380,
    hp: bossHp,
    maxHp: bossHp,
    dmg: 40 + game.wave * 12,
    speed: 0.45,
    range: 75,
    atkSpeed: 55,
    timer: 0,
    isBoss: true,
    anim: 0
  });
  showToast('💀 ¡EL JEFE HA LLEGADO!', '#ef4444');
}

function spawnHero(typeKey) {
  const t = HERO_TYPES[typeKey];
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 160 + Math.random() * 30,
      y: 380 + (Math.random() * 180 - 90),
      timer: 0,
      anim: Math.random() * 10
    });
  }
}

function update() {
  if (game.paused) return;

  if (game.mana < game.maxMana) game.mana += 0.12;

  // Lógica de Héroes
  heroes.forEach((h, hIdx) => {
    h.anim += 0.1;
    let target = null;
    let minDist = Infinity;
    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        projectiles.push({ x: h.x + 10, y: h.y - 30, target: target, dmg: h.dmg, speed: 10, type: h.type });
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Lógica de Enemigos
  enemies.forEach((e, eIdx) => {
    e.anim += 0.1;
    let target = null;
    let minDist = Infinity;
    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;
      }
    } else if (e.x <= 150) {
      game.baseHp -= e.dmg;
    } else {
      e.x -= e.speed;
    }

    if (e.isBoss) {
      let fill = Math.max(0, (e.hp / e.maxHp) * 100);
      document.getElementById('boss-hp-fill').style.width = fill + '%';
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 150 : 15;
      for (let i = 0; i < (e.isBoss ? 25 : 10); i++) {
        particles.push({
          x: e.x, y: e.y - 20,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color: e.isBoss ? '#ef4444' : '#8b5cf6',
          life: 25
        });
      }
      if (e.isBoss) document.getElementById('boss-bar-container').style.display = 'none';
      enemies.splice(eIdx, 1);
    }
  });

  // Lógica de aparición del Jefe Final de la Oleada
  if (enemies.length === 0 && !game.bossSpawned && game.inWave) {
    spawnBoss();
  }

  // Fin de la oleada tras derrotar al Jefe
  if (enemies.length === 0 && game.bossSpawned && game.inWave) {
    game.inWave = false;
    showCards();
  }

  // Proyectiles
  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = (p.target.y - 30) - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 15 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  // Partículas
  particles.forEach((pt, ptIdx) => {
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    if (pt.life <= 0) particles.splice(ptIdx, 1);
  });

  // Actualizar UI
  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  document.getElementById('gold-txt').innerText = game.gold;

  document.getElementById('b-knight').disabled = game.mana < HERO_TYPES.knight.cost;
  document.getElementById('b-archer').disabled = game.mana < HERO_TYPES.archer.cost;
  document.getElementById('b-mage').disabled = game.mana < HERO_TYPES.mage.cost;
  document.getElementById('b-paladin').disabled = game.mana < HERO_TYPES.paladin.cost;
}

// --- RENDERIZADO ILUSTRADO (CASTILLO MEJORADO Y PERSONAJES) ---

function drawCastle() {
  // Torre Principal del Castillo
  let g1 = ctx.createLinearGradient(0, 0, 150, 0);
  g1.addColorStop(0, '#1e293b'); g1.addColorStop(1, '#475569');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 110, 150, 500);

  // Almenas / Muralla Superior
  ctx.fillStyle = '#334155';
  for (let x = 0; x < 150; x += 30) {
    ctx.fillRect(x, 90, 18, 25);
  }

  // Ladrillos detallados
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
  for (let y = 120; y < 600; y += 25) {
    let offset = (y / 25) % 2 === 0 ? 0 : 20;
    for (let x = offset; x < 150; x += 40) {
      ctx.strokeRect(x, y, 40, 25);
    }
  }

  // Portón de Madera Reforzada
  let gateGrad = ctx.createLinearGradient(90, 0, 140, 0);
  gateGrad.addColorStop(0, '#451a03'); gateGrad.addColorStop(1, '#78350f');
  ctx.fillStyle = gateGrad;
  ctx.beginPath();
  ctx.arc(140, 420, 40, Math.PI, Math.PI * 2);
  ctx.fillRect(100, 420, 50, 80);
  ctx.fill();

  // Herrajes y Remaches del portón
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(100, 440); ctx.lineTo(150, 440); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(100, 480); ctx.lineTo(150, 480); ctx.stroke();

  // Banderines Rojos Flameando
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.moveTo(20, 90); ctx.lineTo(20, 60); ctx.lineTo(45, 70); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(120, 90); ctx.lineTo(120, 60); ctx.lineTo(145, 70); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(20, 90); ctx.lineTo(20, 55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(120, 90); ctx.lineTo(120, 55); ctx.stroke();
}

function drawHeroModel(type, x, y, anim) {
  ctx.save();
  ctx.translate(x, y + Math.sin(anim) * 3);

  if (type === 'knight') {
    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(0, -45, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(-6, -47, 12, 3);
    ctx.fillStyle = '#0284c7'; ctx.fillRect(-10, -35, 20, 22);
    ctx.fillStyle = '#16a34a'; ctx.fillRect(-12, -33, 4, 25);
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(10, -50, 6, 35);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(8, -25, 10, 4);
  } else if (type === 'archer') {
    ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, -43, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#15803d'; ctx.fillRect(-8, -34, 16, 20);
    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(10, -25, 18, -Math.PI/2, Math.PI/2); ctx.stroke();
  } else if (type === 'mage') {
    ctx.fillStyle = '#7e22ce';
    ctx.beginPath(); ctx.moveTo(-14, -45); ctx.lineTo(14, -45); ctx.lineTo(0, -68); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b21a8'; ctx.fillRect(-10, -45, 20, 32);
    ctx.fillStyle = '#78350f'; ctx.fillRect(10, -50, 4, 38);
    ctx.fillStyle = '#c084fc'; ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(12, -52, 7, 0, Math.PI*2); ctx.fill();
  } else if (type === 'paladin') {
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(-14, -42, 28, 28);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(-8, -52, 16, 12);
    ctx.fillStyle = '#eab308'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.fillRect(-20, -38, 10, 26); ctx.strokeRect(-20, -38, 10, 26);
  }

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-6, -13, 5, 13); ctx.fillRect(1, -13, 5, 13);
  ctx.restore();
}

function drawEnemyModel(x, y, anim, isBoss) {
  ctx.save();
  ctx.translate(x, y + Math.sin(anim) * 4);
  let s = isBoss ? 2.2 : 1.1;
  ctx.scale(s, s);

  ctx.fillStyle = isBoss ? '#450a0a' : '#334155'; ctx.fillRect(-12, -38, 24, 26);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.moveTo(-8, -48); ctx.lineTo(-16, -62); ctx.lineTo(-4, -50); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -48); ctx.lineTo(16, -62); ctx.lineTo(4, -50); ctx.fill();
  ctx.fillStyle = isBoss ? '#7f1d1d' : '#1e293b'; ctx.fillRect(-9, -50, 18, 14);
  ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
  ctx.fillRect(-6, -46, 4, 3); ctx.fillRect(2, -46, 4, 3);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-18, -32, 6, 20);
  ctx.fillRect(-8, -12, 6, 12); ctx.fillRect(2, -12, 6, 12);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Escenario
  let bgGradient = ctx.createLinearGradient(0, 0, 0, 720);
  bgGradient.addColorStop(0, '#090d16'); bgGradient.addColorStop(0.4, '#1e112a'); bgGradient.addColorStop(1, '#0a0512');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let floorGrad = ctx.createLinearGradient(0, 270, 0, 720);
  floorGrad.addColorStop(0, '#166534'); floorGrad.addColorStop(0.15, '#14532d'); floorGrad.addColorStop(1, '#052e16');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, 270, canvas.width, 450);

  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(canvas.width, 270); ctx.stroke();

  // Render Castillo Ilustrado
  drawCastle();

  // Sombras
  heroes.concat(enemies).forEach(u => {
    let rx = u.isBoss ? 45 : 18;
    ctx.beginPath();
    ctx.ellipse(u.x, u.y, rx, rx / 2.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fill();
  });

  // Héroes
  heroes.forEach(h => {
    drawHeroModel(h.type, h.x, h.y, h.anim);
    ctx.fillStyle = '#000'; ctx.fillRect(h.x - 16, h.y - 68, 32, 5);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(h.x - 15, h.y - 67, (h.hp / h.maxHp) * 30, 3);
  });

  // Enemigos
  enemies.forEach(e => {
    drawEnemyModel(e.x, e.y, e.anim, e.isBoss);
    if (!e.isBoss) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 16, e.y - 68, 32, 5);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - 15, e.y - 67, (e.hp / e.maxHp) * 30, 3);
    }
  });

  // Proyectiles
  projectiles.forEach(p => {
    ctx.save();
    if (p.type === 'mage') {
      ctx.fillStyle = '#c084fc'; ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8;
      ctx.fillRect(p.x, p.y, 10, 4);
    }
    ctx.restore();
  });

  // Partículas
  particles.forEach(pt => {
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 4, 4);
  });
}

// --- CARTAS ROGUELIKE ---
const CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  CARDS.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
