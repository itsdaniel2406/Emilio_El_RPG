<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emolio RPG v8.0 - External Assets Integration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #3b82f6;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    #top-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: row;
      gap: 6px;
      z-index: 15;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #64748b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-btn:active { transform: scale(0.95); }
    #save-btn { border-color: #22c55e; color: #4ade80; }
    #load-btn { border-color: #3b82f6; color: #60a5fa; }
    #reload-btn { border-color: #f59e0b; color: #fbbf24; }
    #fs-btn { border-color: #a855f7; color: #c084fc; }

    #watermark {
      position: absolute;
      bottom: 75px;
      left: 15px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1.5px;
      pointer-events: none;
      z-index: 10;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    #hero-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 14px;
      border-radius: 14px;
      border: 2px solid #475569;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    .hero-btn:active { transform: scale(0.95); }
    .hero-btn span { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }

    #boss-bar-container {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 6px 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 12;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }
    #boss-title { font-size: 12px; font-weight: bold; color: #fca5a5; margin-bottom: 4px; text-transform: uppercase; }
    .boss-hp-bg { width: 100%; height: 10px; background: #450a0a; border-radius: 4px; overflow: hidden; }
    #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 26px; color: #fbbf24; margin-bottom: 15px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 170px; height: 230px; background: #1e293b; border: 3px solid #f59e0b;
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; text-align: center; cursor: pointer;
      transition: transform 0.2s;
    }
    .card-item:hover { transform: translateY(-5px); border-color: #38bdf8; }
    .card-item h3 { color: #fbbf24; font-size: 15px; }
    .card-item p { font-size: 12px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; color: #000; cursor: pointer; }

    #gameover-modal h2 { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); font-size: 32px; }
    .go-box { background: #1e293b; border: 2px solid #ef4444; padding: 20px 30px; border-radius: 12px; text-align: center; }
    .go-btn { background: #ef4444; border: none; color: white; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }

    #toast {
      position: absolute; top: 50px; right: 10px; background: rgba(15, 23, 42, 0.95);
      border: 2px solid #22c55e; color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: bold; display: none; z-index: 25;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emolio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <div id="top-controls">
      <button class="top-btn" id="save-btn" onclick="saveGame()">💾 Guardar</button>
      <button class="top-btn" id="load-btn" onclick="loadGame()">📂 Cargar</button>
      <button class="top-btn" id="reload-btn" onclick="location.reload(true)">🔄 Recargar</button>
      <button class="top-btn" id="fs-btn" onclick="goFullscreen()">⛶ Pantalla Completa</button>
    </div>

    <div id="boss-bar-container">
      <div id="boss-title">⚠️ ¡JEFE FINAL DE OLEADA! ⚠️</div>
      <div class="boss-hp-bg"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="toast"></div>
    <div id="watermark">Creado por Dani v2</div>
    
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE UNA MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>

    <div class="modal" id="gameover-modal">
      <div class="go-box">
        <h2>💀 ¡EL CASTILLO HA CAÍDO! 💀</h2>
        <p style="margin-top:10px; font-size:16px;" id="go-chances-txt">Chances restantes para continuar: 2</p>
        <button class="go-btn" id="go-action-btn" onclick="handleGameOverAction()">REINTENTAR OLEADA</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CARGA DE ASSETS DESDE URLS EXTERNAS ---
const assets = {
  castle: new Image(),
  heroes: {
    knight: new Image(),
    archer: new Image(),
    mage: new Image(),
    paladin: new Image()
  },
  enemies: {
    villain: new Image(),
    boss: new Image()
  }
};

assets.castle.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Isometric%20Mini-Golf/PNG/Default/structure_castle.png';
assets.heroes.knight.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/player_05.png';
assets.heroes.archer.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/player_14.png';
assets.heroes.mage.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/player_17.png';
assets.heroes.paladin.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/player_01.png';
assets.enemies.villain.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/crate_02.png';
assets.enemies.boss.src = 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/master/Assets/Sokoban/PNG/Default/crate_12.png';

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

function showToast(msg, color = '#22c55e') {
  const toast = document.getElementById('toast');
  toast.style.borderColor = color;
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  chances: 2,
  paused: false,
  inWave: true,
  bossSpawned: false,
  invulnerable: false
};

const HERO_TYPES = {
  knight: { name: 'Guerrero', hp: 250, maxHp: 250, dmg: 20, range: 50, speed: 1.2, atkSpeed: 45, cost: 30, type: 'knight' },
  archer: { name: 'Arquera', hp: 120, maxHp: 120, dmg: 16, range: 350, speed: 1.0, atkSpeed: 28, cost: 40, type: 'archer' },
  mage:   { name: 'Mago', hp: 100, maxHp: 100, dmg: 40, range: 250, speed: 0.8, atkSpeed: 60, cost: 60, type: 'mage' },
  paladin:{ name: 'Paladín', hp: 500, maxHp: 500, dmg: 12, range: 50, speed: 0.6, atkSpeed: 55, cost: 80, type: 'paladin' }
};

let heroes = [];
let enemies = [];
let projectiles = [];
let particles = [];

function saveGame() {
  const saveData = { game: game, heroTypes: HERO_TYPES };
  localStorage.setItem('emolio_rpg_save', JSON.stringify(saveData));
  showToast('💾 Partida Guardada');
}

function loadGame() {
  const saved = localStorage.getItem('emolio_rpg_save');
  if (!saved) { showToast('⚠️ No hay partida guardada', '#ef4444'); return; }
  
  const parsed = JSON.parse(saved);
  game = parsed.game;
  Object.assign(HERO_TYPES, parsed.heroTypes);

  resetEntities();
  document.getElementById('card-modal').style.display = 'none';
  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('boss-bar-container').style.display = 'none';
  
  startWave();
  showToast('📂 Partida Cargada', '#3b82f6');
}

function resetEntities() {
  heroes = []; enemies = []; projectiles = []; particles = [];
  game.inWave = true; game.paused = false; game.bossSpawned = false;
}

function startWave() {
  game.bossSpawned = false;
  document.getElementById('boss-bar-container').style.display = 'none';
  let count = 3 + game.wave * 2;

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * 65),
      y: 380 + (Math.random() * 180 - 90),
      hp: 60 + game.wave * 22,
      maxHp: 60 + game.wave * 22,
      dmg: 10 + game.wave * 3,
      speed: 0.7 + Math.random() * 0.4,
      range: 35,
      atkSpeed: 45,
      timer: 0,
      isBoss: false,
      anim: Math.random() * 10
    });
  }
}

function spawnBoss() {
  game.bossSpawned = true;
  document.getElementById('boss-bar-container').style.display = 'flex';
  
  let bossHp = 800 + game.wave * 350;
  enemies.push({
    x: 1350,
    y: 380,
    hp: bossHp,
    maxHp: bossHp,
    dmg: 40 + game.wave * 12,
    speed: 0.45,
    range: 75,
    atkSpeed: 55,
    timer: 0,
    isBoss: true,
    anim: 0
  });
  showToast('💀 ¡EL JEFE HA LLEGADO!', '#ef4444');
}

function spawnHero(typeKey) {
  const t = HERO_TYPES[typeKey];
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 170 + Math.random() * 30,
      y: 380 + (Math.random() * 180 - 90),
      timer: 0,
      anim: Math.random() * 10
    });
  }
}

function update() {
  if (game.paused) return;

  if (game.mana < game.maxMana) game.mana += 0.12;

  // Héroes
  heroes.forEach((h, hIdx) => {
    h.anim += 0.1;
    let target = null;
    let minDist = Infinity;
    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        projectiles.push({ x: h.x + 10, y: h.y - 30, target: target, dmg: h.dmg, speed: 10, type: h.type });
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Enemigos
  enemies.forEach((e, eIdx) => {
    e.anim += 0.1;
    let target = null;
    let minDist = Infinity;
    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;
      }
    } else if (e.x <= 160) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        if (!game.invulnerable) {
          game.baseHp -= e.dmg;
        }
      }
    } else {
      e.x -= e.speed;
    }

    if (e.isBoss) {
      let fill = Math.max(0, (e.hp / e.maxHp) * 100);
      document.getElementById('boss-hp-fill').style.width = fill + '%';
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 150 : 15;
      for (let i = 0; i < (e.isBoss ? 25 : 10); i++) {
        particles.push({
          x: e.x, y: e.y - 20,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color: e.isBoss ? '#ef4444' : '#8b5cf6',
          life: 25
        });
      }
      if (e.isBoss) document.getElementById('boss-bar-container').style.display = 'none';
      enemies.splice(eIdx, 1);
    }
  });

  if (enemies.length === 0 && !game.bossSpawned && game.inWave) {
    spawnBoss();
  }

  if (enemies.length === 0 && game.bossSpawned && game.inWave) {
    game.inWave = false;
    game.invulnerable = false;
    showCards();
  }

  if (game.baseHp <= 0 && !game.paused) {
    triggerGameOver();
  }

  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = (p.target.y - 30) - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 15 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  particles.forEach((pt, ptIdx) => {
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    if (pt.life <= 0) particles.splice(ptIdx, 1);
  });

  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  document.getElementById('gold-txt').innerText = game.gold;

  document.getElementById('b-knight').disabled = game.mana < HERO_TYPES.knight.cost;
  document.getElementById('b-archer').disabled = game.mana < HERO_TYPES.archer.cost;
  document.getElementById('b-mage').disabled = game.mana < HERO_TYPES.mage.cost;
  document.getElementById('b-paladin').disabled = game.mana < HERO_TYPES.paladin.cost;
}

function triggerGameOver() {
  game.paused = true;
  game.baseHp = 0;
  const modal = document.getElementById('gameover-modal');
  const txt = document.getElementById('go-chances-txt');
  const btn = document.getElementById('go-action-btn');

  if (game.chances > 0) {
    txt.innerText = `Te quedan ${game.chances} chance(s) para continuar en la Oleada ${game.wave}`;
    btn.innerText = "REINTENTAR OLEADA";
  } else {
    txt.innerText = "¡Agotaste tus 2 chances! Volverás al Nivel 1.";
    btn.innerText = "REINICIAR DESDE OLEADA 1";
  }
  modal.style.display = 'flex';
}

function handleGameOverAction() {
  const modal = document.getElementById('gameover-modal');
  modal.style.display = 'none';

  if (game.chances > 0) {
    game.chances--;
    game.baseHp = game.maxBaseHp;
    resetEntities();
    startWave();
  } else {
    game.wave = 1;
    game.chances = 2;
    game.gold = 0;
    game.baseHp = game.maxBaseHp;
    resetEntities();
    startWave();
  }
}

function drawCastle() {
  ctx.save();

  if (assets.castle.complete && assets.castle.naturalWidth > 0) {
    ctx.drawImage(assets.castle, -10, 100, 170, 500);
  } else {
    let castleGrad = ctx.createLinearGradient(0, 0, 140, 0);
    castleGrad.addColorStop(0, '#1e293b'); castleGrad.addColorStop(0.5, '#334155'); castleGrad.addColorStop(1, '#475569');
    ctx.fillStyle = castleGrad;
    ctx.fillRect(0, 130, 140, 470);
  }

  // Barra de Vida
  let barW = 120, barH = 12, barX = 10, barY = 50;
  let pct = Math.max(0, game.baseHp / game.maxBaseHp);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = game.invulnerable ? '#a855f7' : '#22c55e'; ctx.fillRect(barX, barY, barW * pct, barH);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);

  ctx.restore();
}

function drawHeroModel(type, x, y, anim) {
  ctx.save();
  ctx.translate(x, y + Math.sin(anim) * 3);

  let img = assets.heroes[type];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -24, -50, 48, 52);
  } else {
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-12, -35, 24, 35);
  }

  ctx.restore();
}

function drawEnemyModel(x, y, anim, isBoss) {
  ctx.save();
  ctx.translate(x, y + Math.sin(anim) * 4);
  
  let img = isBoss ? assets.enemies.boss : assets.enemies.villain;
  let size = isBoss ? 90 : 48;

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -size/2, -size, size, size);
  } else {
    ctx.fillStyle = isBoss ? '#450a0a' : '#ef4444';
    ctx.fillRect(-15, -40, 30, 40);
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let bgGradient = ctx.createLinearGradient(0, 0, 0, 720);
  bgGradient.addColorStop(0, '#090d16'); bgGradient.addColorStop(0.4, '#1e112a'); bgGradient.addColorStop(1, '#0a0512');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let floorGrad = ctx.createLinearGradient(0, 270, 0, 720);
  floorGrad.addColorStop(0, '#166534'); floorGrad.addColorStop(0.15, '#14532d'); floorGrad.addColorStop(1, '#052e16');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, 270, canvas.width, 450);

  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(canvas.width, 270); ctx.stroke();

  drawCastle();

  heroes.concat(enemies).forEach(u => {
    let rx = u.isBoss ? 45 : 18;
    ctx.beginPath();
    ctx.ellipse(u.x, u.y, rx, rx / 2.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fill();
  });

  heroes.forEach(h => {
    drawHeroModel(h.type, h.x, h.y, h.anim);
    ctx.fillStyle = '#000'; ctx.fillRect(h.x - 16, h.y - 60, 32, 5);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(h.x - 15, h.y - 59, (h.hp / h.maxHp) * 30, 3);
  });

  enemies.forEach(e => {
    drawEnemyModel(e.x, e.y, e.anim, e.isBoss);
    if (!e.isBoss) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 16, e.y - 60, 32, 5);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - 15, e.y - 59, (e.hp / e.maxHp) * 30, 3);
    }
  });

  projectiles.forEach(p => {
    ctx.save();
    if (p.type === 'mage') {
      ctx.fillStyle = '#c084fc'; ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8;
      ctx.fillRect(p.x, p.y, 10, 4);
    }
    ctx.restore();
  });

  particles.forEach(pt => {
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 4, 4);
  });
}

const ALL_CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) },
  { 
    title: "💥 BOMBA DIVINA", 
    desc: "¡PODER ÉPICO! Elimina instantáneamente a toda la oleada actual.", 
    run: () => { 
      enemies.forEach(e => e.hp = 0);
      showToast("💥 ¡OLEADA DESTRUIDA POR BOMBA DIVINA!", "#ef4444");
    } 
  },
  { 
    title: "🛡️ ESCUDO FORTALEZA", 
    desc: "El castillo será invulnerable durante toda la siguiente oleada.", 
    run: () => { 
      game.invulnerable = true;
      showToast("🛡️ ¡ESCUDO DE INVULNERABILIDAD ACTIVADO!", "#38bdf8");
    } 
  },
  { 
    title: "🪙 BOTÍN DORADO", 
    desc: "Obtienes +300 Monedas de Oro al instante.", 
    run: () => { 
      game.gold += 300;
      showToast("🪙 +300 ORO OBTENIDO", "#f59e0b");
    } 
  },
  { 
    title: "⚡ RÁFAGA CELESTIAL", 
    desc: "Aumenta un +300% la velocidad de ataque en la siguiente oleada.", 
    run: () => { 
      Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.35);
      showToast("⚡ ¡RÁFAGA DE ATAQUE ACTIVADA!", "#a855f7");
    } 
  }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  let shuffled = [...ALL_CARDS].sort(() => 0.5 - Math.random());
  let selectedCards = shuffled.slice(0, 3);

  selectedCards.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
