<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emolio el RPG v2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08090d; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0e15;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* Pantalla de rotación */
    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    /* Barra Inferior de Héroes */
    #hero-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.95);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      z-index: 10;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    .hero-btn span { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }

    /* Modales */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 26px; color: #fbbf24; margin-bottom: 20px; }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 150px;
      height: 210px;
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }
    .card-item h3 { color: #fbbf24; font-size: 15px; }
    .card-item p { font-size: 11px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; color: #000; }

    /* Botón Pantalla Completa */
    #fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 15;
      background: rgba(0,0,0,0.7);
      border: 1px solid #64748b;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emolio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <button id="fs-btn" onclick="goFullscreen()"> fullscreen</button>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  paused: false,
  inWave: true
};

const HERO_TYPES = {
  knight: { name: 'Guerrero', hp: 250, maxHp: 250, dmg: 20, range: 50, speed: 1.2, atkSpeed: 45, cost: 30, color: '#3b82f6' },
  archer: { name: 'Arquera', hp: 120, maxHp: 120, dmg: 16, range: 350, speed: 1.0, atkSpeed: 28, cost: 40, color: '#10b981' },
  mage:   { name: 'Mago', hp: 100, maxHp: 100, dmg: 40, range: 250, speed: 0.8, atkSpeed: 60, cost: 60, color: '#a855f7' },
  paladin:{ name: 'Paladín', hp: 500, maxHp: 500, dmg: 12, range: 50, speed: 0.6, atkSpeed: 55, cost: 80, color: '#eab308' }
};

let heroes = [];
let enemies = [];
let projectiles = [];

function startWave() {
  const isBoss = game.wave % 5 === 0;
  let count = isBoss ? 1 : 4 + game.wave * 2;

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * (isBoss ? 0 : 70)),
      y: 350 + (Math.random() * 200 - 100),
      hp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      maxHp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      dmg: isBoss ? 60 : 10 + game.wave * 3,
      speed: isBoss ? 0.4 : 0.7 + Math.random() * 0.4,
      range: isBoss ? 70 : 35,
      atkSpeed: isBoss ? 60 : 45,
      timer: 0,
      isBoss: isBoss,
      color: isBoss ? '#ef4444' : '#64748b'
    });
  }
}

function spawnHero(type) {
  const t = HERO_TYPES[type];
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 140 + Math.random() * 30,
      y: 320 + (Math.random() * 200 - 100),
      timer: 0
    });
  }
}

function update() {
  if (game.paused) return;

  if (game.mana < game.maxMana) game.mana += 0.12;

  // Lógica Héroes
  heroes.forEach((h, hIdx) => {
    let target = null;
    let minDist = Infinity;
    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        projectiles.push({ x: h.x, y: h.y, target: target, dmg: h.dmg, speed: 9, color: h.color });
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Lógica Enemigos
  enemies.forEach((e, eIdx) => {
    let target = null;
    let minDist = Infinity;
    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;
      }
    } else if (e.x <= 150) {
      game.baseHp -= e.dmg;
    } else {
      e.x -= e.speed;
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 120 : 15;
      enemies.splice(eIdx, 1);
    }
  });

  // Proyectiles
  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = p.target.y - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 12 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  if (enemies.length === 0 && game.inWave) {
    game.inWave = false;
    showCards();
  }

  // Actualizar UI
  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  document.getElementById('gold-txt').innerText = game.gold;

  document.getElementById('b-knight').disabled = game.mana < HERO_TYPES.knight.cost;
  document.getElementById('b-archer').disabled = game.mana < HERO_TYPES.archer.cost;
  document.getElementById('b-mage').disabled = game.mana < HERO_TYPES.mage.cost;
  document.getElementById('b-paladin').disabled = game.mana < HERO_TYPES.paladin.cost;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Fondo
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Campo de batalla
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 220, canvas.width, 280);

  // Torre Base
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 160, 130, 380);
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(120, 160, 10, 380);

  // Héroes
  heroes.forEach(h => {
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 16, 0, Math.PI*2);
    ctx.fill();

    // Vida
    ctx.fillStyle = '#000';
    ctx.fillRect(h.x-16, h.y-25, 32, 4);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(h.x-16, h.y-25, (h.hp/h.maxHp)*32, 4);
  });

  // Enemigos
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    let r = e.isBoss ? 30 : 18;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.fillRect(e.x-r, e.y-r-8, r*2, 5);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(e.x-r, e.y-r-8, (e.hp/e.maxHp)*(r*2), 5);
  });

  // Proyectiles
  projectiles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
    ctx.fill();
  });
}

const CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  CARDS.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
</body>
</html>
