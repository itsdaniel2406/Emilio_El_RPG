<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emolio el RPG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #game-container { position: relative; width: 800px; height: 450px; border: 4px solid #ffd700; border-radius: 12px; overflow: hidden; background: #2c3e50; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    canvas { display: block; background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    #ui-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px #000; }
    
    /* Cartas Roguelike */
    #cards-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
    #cards-modal h2 { color: #ffd700; font-size: 28px; text-shadow: 0 0 10px #ffd700; }
    .cards-container { display: flex; gap: 20px; }
    .card { width: 160px; height: 220px; background: #222; border: 3px solid #ff9900; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 0 20px #ff9900; }
    .card-title { font-size: 16px; font-weight: bold; color: #ffd700; }
    .card-desc { font-size: 13px; color: #ccc; }
    .card-btn { background: #ff9900; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-overlay">
      <div id="wave-txt">Oleada: 1</div>
      <div id="gold-txt">Oro: 0 🪙</div>
    </div>

    <div id="cards-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE UNA CARTA</h2>
      <div class="cards-container" id="cards-list"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let wave = 1;
let gold = 0;
let inCardSelection = false;

// Prototipo de Héroes
const heroes = [
  { x: 100, y: 150, color: '#3498db', range: 250, atkSpeed: 60, timer: 0, dmg: 15, name: 'Mago' },
  { x: 100, y: 280, color: '#e74c3c', range: 180, atkSpeed: 40, timer: 0, dmg: 10, name: 'Guerrero' }
];

// Enemigos y Proyectiles
let enemies = [];
let projectiles = [];

function spawnWave() {
  const count = wave * 4;
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 850 + (i * 45),
      y: 120 + Math.random() * 220,
      hp: 30 + (wave * 15),
      maxHp: 30 + (wave * 15),
      speed: 1 + Math.random() * 0.5,
      color: '#2ecc71'
    });
  }
}

function update() {
  if (inCardSelection) return;

  // Lógica de Héroes
  heroes.forEach(h => {
    h.timer++;
    if (h.timer >= h.atkSpeed) {
      // Buscar enemigo cercano
      let target = enemies.find(e => Math.hypot(e.x - h.x, e.y - h.y) < h.range);
      if (target) {
        projectiles.push({ x: h.x, y: h.y, target: target, dmg: h.dmg, speed: 7 });
        h.timer = 0;
      }
    }
  });

  // Lógica de Proyectiles
  projectiles.forEach((p, index) => {
    let dx = p.target.x - p.x;
    let dy = p.target.y - p.y;
    let dist = Math.hypot(dx, dy);
    
    if (dist < 10 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(index, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  // Lógica de Enemigos
  enemies.forEach((e, index) => {
    e.x -= e.speed;
    if (e.hp <= 0) {
      gold += 10;
      enemies.splice(index, 1);
    }
  });

  // Siguiente Oleada / Selección de Cartas
  if (enemies.length === 0) {
    wave++;
    showCardSelection();
  }

  document.getElementById('wave-txt').innerText = `Oleada: ${wave}`;
  document.getElementById('gold-txt').innerText = `Oro: ${gold} 🪙`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dibujar Héroes
  heroes.forEach(h => {
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 20, 0, Math.PI * 2);
    ctx.fill();
  });

  // Dibujar Enemigos
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - 15, e.y - 15, 30, 30);
    // Barra de Vida
    ctx.fillStyle = 'red';
    ctx.fillRect(e.x - 15, e.y - 25, 30, 5);
    ctx.fillStyle = 'green';
    ctx.fillRect(e.x - 15, e.y - 25, (e.hp / e.maxHp) * 30, 5);
  });

  // Dibujar Proyectiles
  ctx.fillStyle = '#f1c40f';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// Sistema de Mejores estilo Roguelike
const cardPool = [
  { title: "⚡ Ataque Furia", desc: "+30% Velocidad de Ataque", apply: () => heroes.forEach(h => h.atkSpeed *= 0.7) },
  { title: "🗡️ Filo Afilado", desc: "+15 de Daño base", apply: () => heroes.forEach(h => h.dmg += 15) },
  { title: "🎯 Ojo Avizor", desc: "+50 Rango de ataque", apply: () => heroes.forEach(h => h.range += 50) }
];

function showCardSelection() {
  inCardSelection = true;
  const modal = document.getElementById('cards-modal');
  const container = document.getElementById('cards-list');
  container.innerHTML = '';

  cardPool.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div><button class="card-btn">Elegir</button>`;
    el.onclick = () => {
      card.apply();
      modal.style.display = 'none';
      inCardSelection = false;
      spawnWave();
    };
    container.appendChild(el);
  });

  modal.style.display = 'flex';
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

spawnWave();
gameLoop();
</script>
</body>
</html>
