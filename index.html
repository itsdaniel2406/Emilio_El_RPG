<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emilio RPG v11.0 - Mana Boost & Bosses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #3b82f6;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
    .mana-boost {
      font-size: 10px;
      color: #38bdf8;
      margin-left: 2px;
    }

    #top-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: row;
      gap: 6px;
      z-index: 15;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #64748b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-btn:active { transform: scale(0.95); }
    #save-btn { border-color: #22c55e; color: #4ade80; }
    #load-btn { border-color: #3b82f6; color: #60a5fa; }
    #reload-btn { border-color: #f59e0b; color: #fbbf24; }
    #fs-btn { border-color: #a855f7; color: #c084fc; }

    #watermark {
      position: absolute;
      bottom: 85px;
      left: 15px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1.5px;
      pointer-events: none;
      z-index: 10;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    #hero-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid #475569;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 10;
      max-width: 95vw;
      overflow-x: auto;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      min-width: 80px;
    }
    .hero-btn:active { transform: scale(0.95); }
    .hero-btn span { font-size: 9px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }
    .hero-btn.locked { border-color: #ef4444; background: #331010; color: #94a3b8; }

    #boss-bar-container {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 6px 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 12;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }
    #boss-title { font-size: 12px; font-weight: bold; color: #fca5a5; margin-bottom: 4px; text-transform: uppercase; }
    .boss-hp-bg { width: 100%; height: 10px; background: #450a0a; border-radius: 4px; overflow: hidden; }
    #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 24px; color: #fbbf24; margin-bottom: 15px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 170px; height: 230px; background: #1e293b; border: 3px solid #f59e0b;
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; text-align: center; cursor: pointer;
      transition: transform 0.2s;
    }
    .card-item:hover { transform: translateY(-5px); border-color: #38bdf8; }
    .card-item h3 { color: #fbbf24; font-size: 14px; }
    .card-item p { font-size: 11px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; color: #000; cursor: pointer; }

    #gameover-modal h2 { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); font-size: 30px; }
    .go-box { background: #1e293b; border: 2px solid #ef4444; padding: 20px 30px; border-radius: 12px; text-align: center; }
    .go-btn { background: #ef4444; border: none; color: white; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }

    #toast {
      position: absolute; top: 50px; right: 10px; background: rgba(15, 23, 42, 0.95);
      border: 2px solid #22c55e; color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: bold; display: none; z-index: 25;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emilio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span><span class="mana-boost" id="mana-boost-txt">(+0.0%)</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <div id="top-controls">
      <button class="top-btn" id="save-btn" onclick="saveGame()">💾 Guardar</button>
      <button class="top-btn" id="load-btn" onclick="loadGame()">📂 Cargar</button>
      <button class="top-btn" id="reload-btn" onclick="location.reload(true)">🔄 Recargar</button>
      <button class="top-btn" id="fs-btn" onclick="goFullscreen()">⛶ Pantalla Completa</button>
    </div>

    <div id="boss-bar-container">
      <div id="boss-title">⚠️ ¡JEFE DE OLEADA DETECTADO! ⚠️</div>
      <div class="boss-hp-bg"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="toast"></div>
    <div id="watermark">Creado por Dani v2</div>
    
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
      <!-- Héroes Desbloqueables -->
      <button class="hero-btn locked" onclick="spawnHero('assassin')" id="b-assassin">🥷 Asesino<span>35 M (Niv 20)</span></button>
      <button class="hero-btn locked" onclick="spawnHero('druid')" id="b-druid">🌿 Druida<span>70 M (Niv 33)</span></button>
      <button class="hero-btn locked" onclick="spawnHero('titan')" id="b-titan">⚡ Titán<span>120 M (Niv 41)</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE UNA MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>

    <div class="modal" id="gameover-modal">
      <div class="go-box">
        <h2>💀 ¡EL CASTILLO HA CAÍDO! 💀</h2>
        <p style="margin-top:10px; font-size:16px;" id="go-chances-txt">Chances restantes para continuar: 2</p>
        <button class="go-btn" id="go-action-btn" onclick="handleGameOverAction()">REINTENTAR OLEADA</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

function showToast(msg, color = '#22c55e') {
  const toast = document.getElementById('toast');
  toast.style.borderColor = color;
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2800);
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  baseManaRegen: 0.15,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  chances: 2,
  paused: false,
  inWave: true,
  bossSpawned: false,
  invulnerable: false
};

const HERO_TYPES = {
  knight:   { name: 'Guerrero', hp: 280, maxHp: 280, dmg: 22, range: 45, speed: 1.2, atkSpeed: 40, cost: 30, type: 'knight' },
  archer:   { name: 'Arquera', hp: 130, maxHp: 130, dmg: 18, range: 350, speed: 1.0, atkSpeed: 25, cost: 40, type: 'archer' },
  mage:     { name: 'Mago', hp: 110, maxHp: 110, dmg: 45, range: 260, speed: 0.8, atkSpeed: 55, cost: 60, type: 'mage' },
  paladin:  { name: 'Paladín', hp: 550, maxHp: 550, dmg: 14, range: 50, speed: 0.6, atkSpeed: 50, cost: 80, type: 'paladin' },
  assassin: { name: 'Asesino', hp: 200, maxHp: 200, dmg: 55, range: 40, speed: 2.0, atkSpeed: 18, cost: 35, type: 'assassin', reqWave: 20 },
  druid:    { name: 'Druida', hp: 260, maxHp: 260, dmg: 20, range: 180, speed: 0.9, atkSpeed: 45, cost: 70, type: 'druid', reqWave: 33 },
  titan:    { name: 'Titán', hp: 1200, maxHp: 1200, dmg: 70, range: 60, speed: 0.5, atkSpeed: 60, cost: 120, type: 'titan', reqWave: 41 }
};

let heroes = [];
let enemies = [];
let projectiles = [];
let particles = [];

const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * 1280,
  y: Math.random() * 260,
  r: Math.random() * 1.5 + 0.5
}));

function saveGame() {
  const saveData = { game: game, heroTypes: HERO_TYPES };
  localStorage.setItem('emolio_rpg_save', JSON.stringify(saveData));
  showToast('💾 Partida Guardada');
}

function loadGame() {
  const saved = localStorage.getItem('emolio_rpg_save');
  if (!saved) { showToast('⚠️ No hay partida guardada', '#ef4444'); return; }
  
  const parsed = JSON.parse(saved);
  game = parsed.game;
  Object.assign(HERO_TYPES, parsed.heroTypes);

  resetEntities();
  document.getElementById('card-modal').style.display = 'none';
  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('boss-bar-container').style.display = 'none';
  
  startWave();
  showToast('📂 Partida Cargada', '#3b82f6');
}

function resetEntities() {
  heroes = []; enemies = []; projectiles = []; particles = [];
  game.inWave = true; game.paused = false; game.bossSpawned = false;
}

function startWave() {
  game.bossSpawned = false;
  document.getElementById('boss-bar-container').style.display = 'none';
  let count = 3 + game.wave * 2;

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * 70),
      y: 380 + (Math.random() * 180 - 90),
      hp: 70 + game.wave * 22,
      maxHp: 70 + game.wave * 22,
      dmg: 10 + game.wave * 2.5,
      speed: 0.7 + Math.random() * 0.3,
      range: 40,
      atkSpeed: 45,
      timer: 0,
      isBoss: false,
      anim: Math.random() * 10
    });
  }
}

function spawnBoss() {
  game.bossSpawned = true;
  document.getElementById('boss-bar-container').style.display = 'flex';

  let isDouble = (game.wave % 5 === 0);
  let bossTypes = ['boss_dark', 'boss_zombie', 'boss_bat', 'boss_batman', 'boss_superman'];
  let selectedType = bossTypes[(game.wave - 1) % bossTypes.length];

  let baseHp = 800 + game.wave * 350;
  let bossCount = isDouble ? 2 : 1;

  for (let i = 0; i < bossCount; i++) {
    enemies.push({
      x: 1320 + (i * 80),
      y: 380 + (i * 60 - 30),
      hp: isDouble ? baseHp * 0.55 : baseHp,
      maxHp: isDouble ? baseHp * 0.55 : baseHp,
      dmg: (35 + game.wave * 8) * (isDouble ? 0.7 : 1),
      speed: selectedType === 'boss_bat' ? 0.9 : 0.45,
      range: selectedType === 'boss_superman' ? 220 : 70,
      atkSpeed: selectedType === 'boss_batman' ? 30 : 50,
      timer: 0,
      isBoss: true,
      bossType: selectedType,
      anim: 0,
      stealthTimer: 0
    });
  }

  showToast(isDouble ? '⚠️ ¡OLEADA DE DOBLE JEFE!' : `💀 ¡JEFE: ${selectedType.replace('boss_', '').toUpperCase()}!`, '#ef4444');
}

function spawnHero(typeKey) {
  const t = HERO_TYPES[typeKey];
  if (t.reqWave && game.wave < t.reqWave) {
    showToast(`🔒 Requiere Oleada ${t.reqWave}`, '#ef4444');
    return;
  }
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 170 + Math.random() * 30,
      y: 380 + (Math.random() * 180 - 90),
      timer: 0,
      anim: Math.random() * 10
    });
  }
}

function update() {
  if (game.paused) return;

  // ESCALADO DE MANÁ: +0.5% por cada 5 niveles acumulados
  let manaBoostMultiplier = 1 + (Math.floor(game.wave / 5) * 0.005);
  let currentRegenRate = game.baseManaRegen * manaBoostMultiplier;

  if (game.mana < game.maxMana) {
    game.mana = Math.min(game.maxMana, game.mana + currentRegenRate);
  }

  // Actualizar Héroes
  heroes.forEach((h, hIdx) => {
    h.anim += 0.1;
    let target = null;
    let minDist = Infinity;

    if (h.type === 'druid' && Math.random() < 0.05) {
      heroes.forEach(other => {
        if (Math.hypot(other.x - h.x, other.y - h.y) < 150) {
          other.hp = Math.min(other.maxHp, other.hp + 5);
        }
      });
    }

    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        if (['knight', 'paladin', 'assassin', 'titan'].includes(h.type)) {
          target.hp -= h.dmg;
        } else {
          projectiles.push({ x: h.x + 10, y: h.y - 30, target: target, dmg: h.dmg, speed: 10, type: h.type });
        }
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Actualizar Enemigos
  enemies.forEach((e, eIdx) => {
    e.anim += 0.1;
    let target = null;
    let minDist = Infinity;

    if (e.bossType === 'boss_batman') {
      e.stealthTimer = (e.stealthTimer || 0) + 1;
    }

    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;

        if (e.bossType === 'boss_superman') {
          particles.push({ x: e.x, y: e.y - 40, vx: -12, vy: 0, color: '#ef4444', life: 15 });
        }
      }
    } else if (e.x <= 160) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        if (!game.invulnerable) game.baseHp -= e.dmg;
      }
    } else {
      e.x -= e.speed;
    }

    if (e.isBoss) {
      let totalBossHp = enemies.filter(b => b.isBoss).reduce((acc, b) => acc + b.hp, 0);
      let totalBossMax = enemies.filter(b => b.isBoss).reduce((acc, b) => acc + b.maxHp, 0);
      let fill = Math.max(0, (totalBossHp / totalBossMax) * 100);
      document.getElementById('boss-hp-fill').style.width = fill + '%';
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 200 : 15;
      if (e.isBoss && enemies.filter(b => b.isBoss).length === 1) {
        document.getElementById('boss-bar-container').style.display = 'none';
      }
      enemies.splice(eIdx, 1);
    }
  });

  if (enemies.length === 0 && !game.bossSpawned && game.inWave) {
    spawnBoss();
  }

  if (enemies.length === 0 && game.bossSpawned && game.inWave) {
    game.inWave = false;
    game.invulnerable = false;
    showCards();
  }

  if (game.baseHp <= 0 && !game.paused) {
    triggerGameOver();
  }

  // Proyectiles
  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = (p.target.y - 30) - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 15 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  updateHeroButtons();

  // Actualizar HUD
  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  
  let currentPct = ((manaBoostMultiplier - 1) * 100).toFixed(1);
  document.getElementById('mana-boost-txt').innerText = `(+${currentPct}%)`;
  document.getElementById('gold-txt').innerText = game.gold;
}

function updateHeroButtons() {
  Object.keys(HERO_TYPES).forEach(k => {
    let btn = document.getElementById(`b-${k}`);
    if (btn) {
      let t = HERO_TYPES[k];
      let locked = t.reqWave && game.wave < t.reqWave;
      btn.disabled = locked || game.mana < t.cost;
      if (locked) btn.classList.add('locked'); else btn.classList.remove('locked');
    }
  });
}

function triggerGameOver() {
  game.paused = true;
  game.baseHp = 0;
  const modal = document.getElementById('gameover-modal');
  const txt = document.getElementById('go-chances-txt');
  const btn = document.getElementById('go-action-btn');

  if (game.chances > 0) {
    txt.innerText = `Te quedan ${game.chances} chance(s) para continuar en la Oleada ${game.wave}`;
    btn.innerText = "REINTENTAR OLEADA";
  } else {
    txt.innerText = "¡Agotaste tus chances! Volverás al Nivel 1.";
    btn.innerText = "REINICIAR DESDE OLEADA 1";
  }
  modal.style.display = 'flex';
}

function handleGameOverAction() {
  document.getElementById('gameover-modal').style.display = 'none';

  if (game.chances > 0) {
    game.chances--;
    game.baseHp = game.maxBaseHp;
    resetEntities();
    startWave();
  } else {
    game.wave = 1;
    game.chances = 2;
    game.gold = 0;
    game.baseHp = game.maxBaseHp;
    resetEntities();
    startWave();
  }
}

function drawBackground() {
  let skyGrad = ctx.createLinearGradient(0, 0, 0, 270);
  skyGrad.addColorStop(0, '#030712');
  skyGrad.addColorStop(0.6, '#0f172a');
  skyGrad.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, 270);

  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });

  let groundGrad = ctx.createLinearGradient(0, 270, 0, 720);
  groundGrad.addColorStop(0, '#15803d');
  groundGrad.addColorStop(1, '#052e16');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, 270, canvas.width, 450);

  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(canvas.width, 270); ctx.stroke();
}

function drawCastle() {
  ctx.drawImage(assets.castle, -20, 80, 190, 480);

  let barW = 120, barH = 12, barX = 15, barY = 50;
  let pct = Math.max(0, game.baseHp / game.maxBaseHp);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = game.invulnerable ? '#a855f7' : '#22c55e'; ctx.fillRect(barX, barY, barW * pct, barH);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawCastle();

  // Héroes
  heroes.forEach(h => {
    ctx.save();
    ctx.translate(h.x, h.y + Math.sin(h.anim) * 3);
    let img = assets.heroes[h.type];
    ctx.drawImage(img, -30, -60, 60, 65);
    ctx.restore();

    ctx.fillStyle = '#000'; ctx.fillRect(h.x - 18, h.y - 68, 36, 6);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(h.x - 17, h.y - 67, (h.hp / h.maxHp) * 34, 4);
  });

  // Enemigos
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y + Math.sin(e.anim) * 4);
    
    if (e.bossType === 'boss_batman' && Math.floor(e.stealthTimer / 30) % 2 === 0) {
      ctx.globalAlpha = 0.3;
    }

    let img = e.isBoss ? assets.enemies[e.bossType || 'boss_dark'] : assets.enemies.villain;
    let size = e.isBoss ? 90 : 60;
    ctx.drawImage(img, -size/2, -size + 10, size, size);
    ctx.restore();

    if (!e.isBoss) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 18, e.y - 68, 36, 6);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - 17, e.y - 67, (e.hp / e.maxHp) * 34, 4);
    }
  });

  // Proyectiles
  projectiles.forEach(p => {
    ctx.fillStyle = p.type === 'mage' ? '#c084fc' : '#38bdf8';
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
  });

  particles.forEach(pt => {
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 4, 4);
  });
}

const ALL_CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) },
  { title: "💥 BOMBA DIVINA", desc: "Elimina instantáneamente la oleada actual.", run: () => { enemies.forEach(e => e.hp = 0); } },
  { title: "🛡️ ESCUDO FORTALEZA", desc: "Invulnerabilidad durante la siguiente oleada.", run: () => { game.invulnerable = true; } }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  let shuffled = [...ALL_CARDS].sort(() => 0.5 - Math.random());
  let selectedCards = shuffled.slice(0, 3);

  selectedCards.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
</body>
</html>
