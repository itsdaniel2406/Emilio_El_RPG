<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emolio el RPG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #game-container { position: relative; width: 800px; height: 450px; border: 4px solid #ffd700; border-radius: 12px; overflow: hidden; background: #2c3e50; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    canvas { display: block; background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    #ui-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px #000; }
    
    /* Cartas Roguelike */
    #cards-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
    #cards-modal h2 { color: #ffd700; font-size: 28px; text-shadow: 0 0 10px #ffd700; }
    .cards-container { display: flex; gap: 20px; }
    .card { width: 160px; height: 220px; background: #222; border: 3px solid #ff9900; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 0 20px #ff9900; }
    .card-title { font-size: 16px; font-weight: bold; color: #ffd700; }
    .card-desc { font-size: 13px; color: #ccc; }
    .card-btn { background: #ff9900; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-overlay">
      <div id="wave-txt">Oleada: 1</div>
      <div id="gold-txt">Oro: 0 🪙</div>
    </div>

    <div id="cards-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE UNA CARTA</h2>
      <div class="cards-container" id="cards-list"></div>
    </div>
  </div>
