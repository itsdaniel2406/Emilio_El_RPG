<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emolio el RPG v3.0 - Pixel Art Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08090d; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0e15;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated; /* Fuerza el renderizado Pixel Art nítido */
    }

    /* Pantalla de rotación obligatoria */
    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #334155;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    /* Barra Inferior de Héroes */
    #hero-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.95);
      padding: 8px 12px;
      border-radius: 12px;
      border: 2px solid #475569;
      z-index: 10;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      transition: transform 0.1s;
    }
    .hero-btn:active { transform: scale(0.95); }
    .hero-btn span { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }

    /* Modales Roguelike */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 26px; color: #fbbf24; margin-bottom: 20px; text-shadow: 2px 2px #000; }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 160px;
      height: 220px;
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }
    .card-item h3 { color: #fbbf24; font-size: 15px; }
    .card-item p { font-size: 12px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; color: #000; }

    /* Botón Pantalla Completa */
    #fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 15;
      background: rgba(0,0,0,0.7);
      border: 1px solid #64748b;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emolio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <button id="fs-btn" onclick="goFullscreen()"> Pantalla Completa</button>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  paused: false,
  inWave: true
};

const HERO_TYPES = {
  knight: { name: 'Guerrero', hp: 250, maxHp: 250, dmg: 20, range: 50, speed: 1.2, atkSpeed: 45, cost: 30, sprite: 'knight' },
  archer: { name: 'Arquera', hp: 120, maxHp: 120, dmg: 16, range: 350, speed: 1.0, atkSpeed: 28, cost: 40, sprite: 'archer' },
  mage:   { name: 'Mago', hp: 100, maxHp: 100, dmg: 40, range: 250, speed: 0.8, atkSpeed: 60, cost: 60, sprite: 'mage' },
  paladin:{ name: 'Paladín', hp: 500, maxHp: 500, dmg: 12, range: 50, speed: 0.6, atkSpeed: 55, cost: 80, sprite: 'paladin' }
};

let heroes = [];
let enemies = [];
let projectiles = [];

function startWave() {
  const isBoss = game.wave % 5 === 0;
  let count = isBoss ? 1 : 4 + game.wave * 2;

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * (isBoss ? 0 : 70)),
      y: 350 + (Math.random() * 180 - 90),
      hp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      maxHp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      dmg: isBoss ? 60 : 10 + game.wave * 3,
      speed: isBoss ? 0.4 : 0.7 + Math.random() * 0.4,
      range: isBoss ? 70 : 35,
      atkSpeed: isBoss ? 60 : 45,
      timer: 0,
      isBoss: isBoss,
      animTimer: Math.random() * 10
    });
  }
}

function spawnHero(type) {
  const t = HERO_TYPES[type];
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 140 + Math.random() * 30,
      y: 320 + (Math.random() * 180 - 90),
      timer: 0,
      animTimer: 0
    });
  }
}

function update() {
  if (game.paused) return;

  if (game.mana < game.maxMana) game.mana += 0.12;

  // Lógica de Héroes
  heroes.forEach((h, hIdx) => {
    h.animTimer += 0.1;
    let target = null;
    let minDist = Infinity;
    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        projectiles.push({ 
          x: h.x, y: h.y - 10, 
          target: target, 
          dmg: h.dmg, 
          speed: 9, 
          type: h.sprite 
        });
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Lógica de Enemigos
  enemies.forEach((e, eIdx) => {
    e.animTimer += 0.1;
    let target = null;
    let minDist = Infinity;
    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;
      }
    } else if (e.x <= 150) {
      game.baseHp -= e.dmg;
    } else {
      e.x -= e.speed;
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 120 : 15;
      enemies.splice(eIdx, 1);
    }
  });

  // Lógica de Proyectiles
  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = (p.target.y - 10) - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 12 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  if (enemies.length === 0 && game.inWave) {
    game.inWave = false;
    showCards();
  }

  // Actualizar UI
  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  document.getElementById('gold-txt').innerText = game.gold;

  document.getElementById('b-knight').disabled = game.mana < HERO_TYPES.knight.cost;
  document.getElementById('b-archer').disabled = game.mana < HERO_TYPES.archer.cost;
  document.getElementById('b-mage').disabled = game.mana < HERO_TYPES.mage.cost;
  document.getElementById('b-paladin').disabled = game.mana < HERO_TYPES.paladin.cost;
}

// --- RENDERIZADO PIXEL ART PROCEDURAL ---

function drawPixelSprite(type, x, y, anim, isBoss = false) {
  ctx.save();
  ctx.translate(x, y + Math.sin(anim) * 2); // Efecto sutil de respiración/caminar
  let s = isBoss ? 2.2 : 1.3;
  ctx.scale(s, s);

  if (type === 'knight') {
    // Casco y Armadura Azul
    ctx.fillStyle = '#64748b'; ctx.fillRect(-8, -20, 16, 10);
    ctx.fillStyle = '#3b82f6'; ctx.fillRect(-7, -10, 14, 12);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(-3, -17, 8, 3); // Visor
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(6, -12, 4, 14); // Espada
  } 
  else if (type === 'archer') {
    // Túnica Verde y Arco
    ctx.fillStyle = '#15803d'; ctx.fillRect(-6, -18, 12, 18);
    ctx.fillStyle = '#fde047'; ctx.fillRect(-5, -22, 10, 6); // Pelo
    ctx.fillStyle = '#78350f'; ctx.fillRect(4, -16, 2, 14); // Arco
  } 
  else if (type === 'mage') {
    // Túnica Púrpura y Sombrero
    ctx.fillStyle = '#7e22ce'; ctx.fillRect(-7, -16, 14, 16);
    ctx.fillStyle = '#a855f7'; ctx.fillRect(-9, -24, 18, 8); // Sombrero
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(5, -18, 3, 18); // Báculo
  } 
  else if (type === 'paladin') {
    // Armadura Dorada y Escudo
    ctx.fillStyle = '#eab308'; ctx.fillRect(-9, -22, 18, 22);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(-11, -14, 6, 12); // Escudo
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, -18, 8, 4);
  } 
  else if (type === 'enemy') {
    // Orco/Monstruo Rojo-Gris
    ctx.fillStyle = isBoss ? '#991b1b' : '#475569';
    ctx.fillRect(-8, -18, 16, 18);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-5, -14, 10, 4); // Ojos
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-10, -8, 4, 8); // Garrotes
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Fondo / Cielo Nocturno
  let sky = ctx.createLinearGradient(0, 0, 0, 250);
  sky.addColorStop(0, '#020617');
  sky.addColorStop(1, '#0f172a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, 250);

  // Montañas Pixeladas de fondo
  ctx.fillStyle = '#1e293b';
  for(let i = 0; i < canvas.width; i += 80) {
    ctx.beginPath();
    ctx.moveTo(i, 250);
    ctx.lineTo(i + 40, 160);
    ctx.lineTo(i + 80, 250);
    ctx.fill();
  }

  // 2. Campo de Batalla (Suelo de Piedra y Hierba Pixel)
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, 240, canvas.width, 15); // Borde de Hierba
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 255, canvas.width, 260); // Camino de Piedra

  // Textura de Adoquines
  ctx.fillStyle = '#1e293b';
  for (let x = 0; x < canvas.width; x += 40) {
    for (let y = 260; y < 510; y += 30) {
      if ((x + y) % 20 === 0) ctx.fillRect(x, y, 36, 26);
    }
  }

  // 3. Muralla / Castillo Base
  ctx.fillStyle = '#475569';
  ctx.fillRect(0, 150, 140, 380);
  ctx.fillStyle = '#0f172a';
  // Detalles de Ladrillo
  for (let y = 160; y < 520; y += 25) {
    ctx.fillRect(0, y, 140, 2);
  }
  // Almenas Superiores
  ctx.fillStyle = '#334155';
  for (let i = 0; i < 140; i += 28) {
    ctx.fillRect(i, 130, 16, 20);
  }

  // 4. Dibujar Héroes (Pixel Art + Barras de Vida)
  heroes.forEach(h => {
    drawPixelSprite(h.sprite, h.x, h.y, h.animTimer);

    // Barra de Vida Retro
    ctx.fillStyle = '#000';
    ctx.fillRect(h.x - 14, h.y - 32, 28, 5);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(h.x - 13, h.y - 31, (h.hp / h.maxHp) * 26, 3);
  });

  // 5. Dibujar Enemigos
  enemies.forEach(e => {
    drawPixelSprite('enemy', e.x, e.y, e.animTimer, e.isBoss);

    // Barra de Vida Enemigo
    let w = e.isBoss ? 50 : 28;
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - w/2, e.y - (e.isBoss ? 50 : 32), w, 6);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(e.x - (w/2 - 1), e.y - (e.isBoss ? 49 : 31), (e.hp / e.maxHp) * (w - 2), 4);
  });

  // 6. Proyectiles y Efectos
  projectiles.forEach(p => {
    if (p.type === 'mage') {
      ctx.fillStyle = '#a855f7'; // Orbe de fuego místico
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'archer') {
      ctx.fillStyle = '#fde047'; // Flecha dorada
      ctx.fillRect(p.x, p.y, 10, 2);
    } else {
      ctx.fillStyle = '#3b82f6'; // Estallido de corte
      ctx.fillRect(p.x, p.y, 6, 6);
    }
  });
}

// --- CARTAS ROGUELIKE ---
const CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  CARDS.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
</body>
</html>
