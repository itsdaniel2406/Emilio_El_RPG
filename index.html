<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emolio el RPG v3.0 - Pro Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    /* Pantalla de rotación obligatoria */
    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0e15;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-screen h2 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }

    @media screen and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    /* Marca de agua */
    #watermark {
      position: absolute;
      top: 50px;
      left: 15px;
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1.5px;
      pointer-events: none;
      z-index: 10;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* Barra Inferior de Héroes */
    #hero-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 16px;
      border-radius: 14px;
      border: 2px solid #475569;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .hero-btn {
      background: #1e293b;
      border: 2px solid #3b82f6;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }
    .hero-btn:active { transform: scale(0.95); }
    .hero-btn span { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .hero-btn:disabled { opacity: 0.3; border-color: #64748b; }

    /* Modales Roguelike */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal h2 { font-size: 26px; color: #fbbf24; margin-bottom: 20px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .cards-wrapper { display: flex; gap: 15px; }
    .card-item {
      width: 160px;
      height: 220px;
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
    }
    .card-item h3 { color: #fbbf24; font-size: 15px; }
    .card-item p { font-size: 12px; color: #cbd5e1; }
    .btn-select { background: #f59e0b; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; color: #000; }

    /* Botón Pantalla Completa */
    #fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 15;
      background: rgba(0,0,0,0.7);
      border: 1px solid #64748b;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="rotate-screen">
    <h2>🔄 Gira tu dispositivo</h2>
    <p>Emolio el RPG está diseñado para jugarse en pantalla horizontal.</p>
  </div>

  <div id="game-container">
    <button id="fs-btn" onclick="goFullscreen()"> Pantalla Completa</button>
    <div id="watermark">Creado por Dani v2</div>
    
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="hud">
      <div class="hud-card">🏰 Base: <span id="hp-txt">1000</span></div>
      <div class="hud-card">⚔️ Oleada: <span id="wave-txt">1</span></div>
      <div class="hud-card">💧 Maná: <span id="mana-txt">100</span></div>
      <div class="hud-card">🪙 Oro: <span id="gold-txt">0</span></div>
    </div>

    <div id="hero-bar">
      <button class="hero-btn" onclick="spawnHero('knight')" id="b-knight">🗡️ Guerrero<span>30 M</span></button>
      <button class="hero-btn" onclick="spawnHero('archer')" id="b-archer">🏹 Arquera<span>40 M</span></button>
      <button class="hero-btn" onclick="spawnHero('mage')" id="b-mage">🔥 Mago<span>60 M</span></button>
      <button class="hero-btn" onclick="spawnHero('paladin')" id="b-paladin">🛡️ Paladín<span>80 M</span></button>
    </div>

    <div class="modal" id="card-modal">
      <h2>¡SUBIDA DE NIVEL! ELIGE MEJORA</h2>
      <div class="cards-wrapper" id="cards-container"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

let game = {
  gold: 0,
  mana: 100,
  maxMana: 100,
  wave: 1,
  baseHp: 1000,
  maxBaseHp: 1000,
  paused: false,
  inWave: true
};

const HERO_TYPES = {
  knight: { name: 'Guerrero', hp: 250, maxHp: 250, dmg: 20, range: 50, speed: 1.2, atkSpeed: 45, cost: 30, color: '#00ffff', glow: '#005580' },
  archer: { name: 'Arquera', hp: 120, maxHp: 120, dmg: 16, range: 350, speed: 1.0, atkSpeed: 28, cost: 40, color: '#10b981', glow: '#047857' },
  mage:   { name: 'Mago', hp: 100, maxHp: 100, dmg: 40, range: 250, speed: 0.8, atkSpeed: 60, cost: 60, color: '#a855f7', glow: '#6b21a8' },
  paladin:{ name: 'Paladín', hp: 500, maxHp: 500, dmg: 12, range: 50, speed: 0.6, atkSpeed: 55, cost: 80, color: '#eab308', glow: '#854d0e' }
};

let heroes = [];
let enemies = [];
let projectiles = [];
let particles = [];

function startWave() {
  const isBoss = game.wave % 5 === 0;
  let count = isBoss ? 1 : 4 + game.wave * 2;

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 1300 + (i * (isBoss ? 0 : 70)),
      y: 360 + (Math.random() * 200 - 100),
      hp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      maxHp: isBoss ? 1000 + game.wave * 400 : 60 + game.wave * 25,
      dmg: isBoss ? 60 : 10 + game.wave * 3,
      speed: isBoss ? 0.4 : 0.7 + Math.random() * 0.4,
      range: isBoss ? 70 : 35,
      atkSpeed: isBoss ? 60 : 45,
      timer: 0,
      isBoss: isBoss,
      glow: isBoss ? '#ff0044' : '#ef4444'
    });
  }
}

function spawnHero(type) {
  const t = HERO_TYPES[type];
  if (game.mana >= t.cost) {
    game.mana -= t.cost;
    heroes.push({
      ...t,
      x: 150 + Math.random() * 30,
      y: 360 + (Math.random() * 200 - 100),
      timer: 0,
      typeKey: type
    });
  }
}

function update() {
  if (game.paused) return;

  if (game.mana < game.maxMana) game.mana += 0.12;

  // Lógica de Héroes
  heroes.forEach((h, hIdx) => {
    let target = null;
    let minDist = Infinity;
    enemies.forEach(e => {
      let d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target && minDist <= h.range) {
      h.timer++;
      if (h.timer >= h.atkSpeed) {
        h.timer = 0;
        projectiles.push({ x: h.x, y: h.y - 20, target: target, dmg: h.dmg, speed: 10, color: h.color });
      }
    } else {
      h.x += h.speed;
    }

    if (h.hp <= 0) heroes.splice(hIdx, 1);
  });

  // Lógica de Enemigos
  enemies.forEach((e, eIdx) => {
    let target = null;
    let minDist = Infinity;
    heroes.forEach(h => {
      let d = Math.hypot(h.x - e.x, h.y - e.y);
      if (d < minDist) { minDist = d; target = h; }
    });

    if (target && minDist <= e.range) {
      e.timer++;
      if (e.timer >= e.atkSpeed) {
        e.timer = 0;
        target.hp -= e.dmg;
      }
    } else if (e.x <= 150) {
      game.baseHp -= e.dmg;
    } else {
      e.x -= e.speed;
    }

    if (e.hp <= 0) {
      game.gold += e.isBoss ? 120 : 15;
      // Generar partículas de muerte
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: e.x, y: e.y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color: e.glow,
          life: 25
        });
      }
      enemies.splice(eIdx, 1);
    }
  });

  // Lógica de Proyectiles
  projectiles.forEach((p, pIdx) => {
    let dx = p.target.x - p.x;
    let dy = (p.target.y - 20) - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 15 || p.target.hp <= 0) {
      if (p.target.hp > 0) p.target.hp -= p.dmg;
      projectiles.splice(pIdx, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  });

  // Partículas
  particles.forEach((pt, ptIdx) => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(ptIdx, 1);
  });

  if (enemies.length === 0 && game.inWave) {
    game.inWave = false;
    showCards();
  }

  // Actualizar UI
  document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(game.baseHp));
  document.getElementById('wave-txt').innerText = game.wave;
  document.getElementById('mana-txt').innerText = Math.floor(game.mana);
  document.getElementById('gold-txt').innerText = game.gold;

  document.getElementById('b-knight').disabled = game.mana < HERO_TYPES.knight.cost;
  document.getElementById('b-archer').disabled = game.mana < HERO_TYPES.archer.cost;
  document.getElementById('b-mage').disabled = game.mana < HERO_TYPES.mage.cost;
  document.getElementById('b-paladin').disabled = game.mana < HERO_TYPES.paladin.cost;
}

// --- RENDERIZADO AVANZADO CON EFECTOS VISUALES EN CAPAS ---

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // CAPA 1: Fondo Gradiente de atmósfera
  let bgGradient = ctx.createLinearGradient(0, 0, 0, 720);
  bgGradient.addColorStop(0, '#1a0b2e'); // Púrpura oscuro
  bgGradient.addColorStop(0.6, '#4c2a5c');
  bgGradient.addColorStop(1, '#110519');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // CAPA 2: Suelo detallado con volumen y brillo
  let floorGradient = ctx.createLinearGradient(0, 260, 0, 720);
  floorGradient.addColorStop(0, '#2e7d32');
  floorGradient.addColorStop(1, '#0f3811');
  ctx.fillStyle = floorGradient;
  ctx.fillRect(0, 260, canvas.width, 460);

  // Línea brillante en el borde del campo
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 260);
  ctx.lineTo(canvas.width, 260);
  ctx.stroke();

  // CAPA 3: Muralla / Base Fortaleza
  let wallGrad = ctx.createLinearGradient(0, 0, 150, 0);
  wallGrad.addColorStop(0, '#1e293b');
  wallGrad.addColorStop(1, '#475569');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 120, 140, 480);

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 120, 140, 480);

  // CAPA 4: Sombras Proyectadas en el Suelo
  heroes.concat(enemies).forEach(unit => {
    let r = unit.isBoss ? 45 : 20;
    ctx.beginPath();
    ctx.ellipse(unit.x, unit.y + 10, r, r / 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fill();
  });

  // CAPA 5: Héroes con Iluminación Dinámica Radial y Auras
  heroes.forEach(h => {
    ctx.save();
    ctx.shadowColor = h.color;
    ctx.shadowBlur = 18;

    let grad = ctx.createRadialGradient(h.x - 5, h.y - 25, 2, h.x, h.y - 15, 25);
    grad.addColorStop(0, h.color);
    grad.addColorStop(0.7, h.glow);
    grad.addColorStop(1, '#000');

    ctx.fillStyle = grad;
    ctx.fillRect(h.x - 16, h.y - 45, 32, 50); // Cuerpo estilizado
    ctx.restore();

    // Barra de Vida
    ctx.fillStyle = '#000';
    ctx.fillRect(h.x - 16, h.y - 58, 32, 5);
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(h.x - 15, h.y - 57, (h.hp / h.maxHp) * 30, 3);
  });

  // CAPA 6: Enemigos y Jefes con Aura Amenazante
  enemies.forEach(e => {
    ctx.save();
    ctx.shadowColor = e.glow;
    ctx.shadowBlur = e.isBoss ? 30 : 18;

    let sizeW = e.isBoss ? 60 : 36;
    let sizeH = e.isBoss ? 80 : 50;

    let grad = ctx.createRadialGradient(e.x - 5, e.y - 25, 3, e.x, e.y - 20, sizeW);
    grad.addColorStop(0, '#ff4d4d');
    grad.addColorStop(0.8, '#4a0000');
    grad.addColorStop(1, '#110000');

    ctx.fillStyle = grad;
    ctx.fillRect(e.x - sizeW/2, e.y - sizeH + 5, sizeW, sizeH);
    ctx.restore();

    // Barra de Vida
    let bWidth = sizeW + 10;
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - bWidth/2, e.y - sizeH - 12, bWidth, 6);
    ctx.fillStyle = '#ff0044';
    ctx.fillRect(e.x - bWidth/2 + 1, e.y - sizeH - 11, (e.hp / e.maxHp) * (bWidth - 2), 4);
  });

  // CAPA 7: Proyectiles con Resplandor Vibrante
  projectiles.forEach(p => {
    ctx.save();
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // CAPA 8: Partículas
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 4, 4);
  });
}

// --- CARTAS ROGUELIKE ---
const CARDS = [
  { title: "⚡ Ataque Veloz", desc: "+20% Velocidad de ataque general", run: () => Object.values(HERO_TYPES).forEach(h => h.atkSpeed *= 0.8) },
  { title: "🗡️ Filo Afilado", desc: "+25% Daño de Héroes", run: () => Object.values(HERO_TYPES).forEach(h => h.dmg *= 1.25) },
  { title: "🏰 Reparar Base", desc: "+300 Vida a la torre", run: () => game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 300) }
];

function showCards() {
  game.paused = true;
  const modal = document.getElementById('card-modal');
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  CARDS.forEach(c => {
    let d = document.createElement('div');
    d.className = 'card-item';
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p><button class="btn-select">Elegir</button>`;
    d.onclick = () => {
      c.run();
      modal.style.display = 'none';
      game.paused = false;
      game.wave++;
      game.inWave = true;
      startWave();
    };
    container.appendChild(d);
  });

  modal.style.display = 'flex';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startWave();
loop();
</script>
</body>
</html>
